spring:
  application:
    name: rha
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rha}
    username: ${DB_USERNAME:rha}
    password: ${DB_PASSWORD:rha}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  data:
    web:
      pageable:
        one-indexed-parameters: true

server:
  servlet:
    context-path: /v1
