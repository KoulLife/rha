services:
  postgres:
    image: postgres:16-alpine
    container_name: rha-postgres
    environment:
      POSTGRES_DB: rha
      POSTGRES_USER: rha
      POSTGRES_PASSWORD: rha
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - rha-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rha -d rha"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  rha-postgres-data:
