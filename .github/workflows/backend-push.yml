
name: RHA Backend Build and ECR Push

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'VERSION'
      - '.github/workflows/backend-push.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: rha-backend-build
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: r.ha_dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Version
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid VERSION: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::592193418739:role/r.ha_github_access
          aws-region: ap-northeast-2

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Backend
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          SHORT_SHA="${GITHUB_SHA:0:7}"
          TAG="backend-${VERSION}-${SHORT_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          IMAGE="$REGISTRY/$ECR_REPOSITORY:$TAG"

          docker build \
            --platform linux/amd64 \
            -t "$IMAGE" \
            ./backend

          docker push "$IMAGE"

          echo "Backend Image: $IMAGE" >> "$GITHUB_STEP_SUMMARY"
