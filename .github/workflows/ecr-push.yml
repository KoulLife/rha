
name: RHA Frontend Build and ECR Push

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: r.ha_dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub 코드 다운로드
      - name: Checkout
        uses: actions/checkout@v4

      # 2. VERSION 파일 읽기
      - name: Read Version
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # 3. AWS OIDC 인증
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::592193418739:role/r.ha_github_access
          aws-region: ap-northeast-2

      # 4. AWS ECR 로그인
      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 5. Docker 이미지 빌드 및 Push
      - name: Build and Push Frontend
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          SHORT_SHA="${GITHUB_SHA:0:7}"
          TAG="frontend-${VERSION}-${SHORT_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          IMAGE="$REGISTRY/$ECR_REPOSITORY:$TAG"

          echo "Building: $IMAGE"

          docker build \
          --platform linux/amd64 \
          -f frontend/Dockerfile \
          -t "$IMAGE" \
          .

          docker push "$IMAGE"

          echo "Pushed: $IMAGE"
          echo "Image: $IMAGE" >> "$GITHUB_STEP_SUMMARY"
