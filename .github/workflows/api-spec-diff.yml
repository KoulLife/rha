name: API Spec Diff

# 포크에서 온 PR도 코멘트와 Slack 알림이 동작하도록 pull_request_target을 쓴다.
# 이 이벤트는 base 저장소의 권한과 secret으로 실행되므로, PR의 코드는 절대 실행하지 않는다.
# PR에서 가져오는 것은 openapi.yaml 파일뿐이며 oasdiff로 읽기만 한다.
on:
  pull_request_target:
    paths:
      - api-spec/openapi.yaml

permissions:
  contents: read
  pull-requests: write

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout은 pull_request_target에서 포크 PR 코드를 체크아웃하는 것을 거부한다.
      # base 브랜치만 체크아웃하고, PR에서는 git으로 openapi.yaml 한 파일만 읽어 온다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare base and revision specs
        run: |
          git show "origin/${{ github.base_ref }}:api-spec/openapi.yaml" > .oasdiff-base.yaml
          git fetch origin "refs/pull/${{ github.event.pull_request.number }}/merge"
          git show FETCH_HEAD:api-spec/openapi.yaml > .oasdiff-revision.yaml

      # secret이 있는 환경에서 실행되므로 제3자 액션은 커밋 SHA로 고정한다 (v0.1.18).
      - name: Generate changelog
        id: changelog
        uses: oasdiff/oasdiff-action/changelog@b9325c9e0a27ab65b0da3b766522cedec6be81dc
        with:
          base: .oasdiff-base.yaml
          revision: .oasdiff-revision.yaml
          format: markdown

      - name: Detect breaking changes
        id: breaking
        uses: oasdiff/oasdiff-action/breaking@b9325c9e0a27ab65b0da3b766522cedec6be81dc
        with:
          base: .oasdiff-base.yaml
          revision: .oasdiff-revision.yaml
          fail-on: ERR
        continue-on-error: true

      - name: Comment on PR
        uses: actions/github-script@v7
        env:
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
          BREAKING: ${{ steps.breaking.outcome }}
        with:
          script: |
            const marker = '<!-- api-spec-diff -->';
            const breaking = process.env.BREAKING === 'failure';
            const body = [
              marker,
              '## API 스펙 변경 요약',
              breaking ? '> :warning: **Breaking change가 포함되어 있습니다.**' : '> Breaking change 없음',
              '',
              process.env.CHANGELOG || '_변경 내역 없음_',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const prev = comments.find(c => c.body && c.body.includes(marker));
            if (prev) await github.rest.issues.updateComment({ owner, repo, comment_id: prev.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          BREAKING: ${{ steps.breaking.outcome }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && exit 0
          flag=""
          [ "$BREAKING" = "failure" ] && flag=" :warning: *BREAKING*"
          text=$(printf ':memo: API 스펙 변경 PR%s\n<%s|%s>' "$flag" "$PR_URL" "$PR_TITLE")
          jq -n --arg t "$text" '{text: $t}' \
            | curl -fsS -X POST -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK_URL"

      - name: Fail on breaking change
        if: steps.breaking.outcome == 'failure'
        run: |
          echo "Breaking change 감지. 의도한 변경이면 PR 설명에 근거를 남기고 리뷰어 승인으로 진행하세요."
          exit 1
